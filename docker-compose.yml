# Run the demo:            docker compose up --build        -> http://localhost:3000
# Live-reload while editing: docker compose --profile dev up dev  -> http://localhost:3001

services:
  web:
    build: .
    image: bcc-rak-hub:latest
    container_name: bcc-rak-hub
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: bcc-rak-hub-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3001:3000"
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next

volumes:
  dev_node_modules:
  dev_next:
